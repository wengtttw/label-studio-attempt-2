  </View>
  
  <!-- Follow-Up Q3 -->
  <View className="section-box">
  <Header value="❓Follow-Up Question 3" size="3"/>
  <Text name="followup_q3" value="$question_and_answers.question_3"
        style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; 
               margin: 5px 0; background-color: #f9f9f9;"/>
  <Header value="🖼️ Old Caption to be assessed:"/>
