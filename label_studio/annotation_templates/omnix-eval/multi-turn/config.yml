title: Multi Turn
type: community
group: Omnix Evaluation
image: /static/templates/multi-turn.png
details: |
  <h1>Label different described features</h1>
  <dl>
    <dt>Industry Applications</dt>
    <dd>scene understanding, visual reasoning, computer vision research, multimodal AI, robotics training, autonomous systems, visual question answering, image captioning, visual relationship detection, scene graph generation, complex scene analysis</dd>
    <dt>Associated Models</dt>
    <dd>region detection, attribute classification, relationship extraction, structured scene representation</dd>
    <dt>Domain Terminology</dt>
    <dd>scene graphs, visual knowledge, spatial relationships, object interactions, contextual understanding</dd>
  </dl>
config: |
  <View>
  <style>
    .lsf-richtext__line {
      padding-left: 0px;
    }
    .ant-form-item{
      margin: 0 0 4px
    }
    .section-box {
      border: 1px solid #ddd; 
      border-radius: 12px; 
      padding: 12px; 
      margin: 50px 0; 
      background-color: #f5f7fa;
    }
  </style>

  <!-- Image + Main Question -->
  <Image name="image" value="$image_url" width="100%" height="300px"/>
  
  <View className="section-box" style="margin: 25px 0">
  <Header name="question" value="❓Question:" size="3"/>
  <Text name="question_display" value="$question_and_answers.question_0"
        style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; 
               margin: 5px 0; background-color: #f9f9f9;"/>
  <Header value="🖼️ Old Caption to be assessed:" size="4"/>
  <Text name="old_caption" value="$question_and_answers.answer_0"
        style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; 
               margin: 5px 0; background-color: #f9f9f9;"/>
  <Header value="✍️ New Caption:" size="4"/>
  <TextArea name="new_caption_0" toName="image" value="$question_and_answers.answer_0"
            placeholder="Type in new caption here"
            rows="10" maxSubmissions="1" required="true"
            style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; margin: 5px 0;"/>
  <Header value="🪧 Reference if any:" size="6"/>
  <TextArea name="reference_0" toName="image"
            placeholder="Type in reference to your caption here if any"
            rows="2" maxSubmissions="1" style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; margin: 5px 0;"/>
  </View>

  <!-- Follow-Up Q1 -->
  <View className="section-box">
  <Header value="❓Follow-Up Question 1" size="3"/>
  <Text name="followup_q1" value="question_and_answers.question_1"
        style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; 
               margin: 5px 0; background-color: #f9f9f9;"/>
  <Header value="🖼️ Old Caption to be assessed:"/>
  <Text name="followup_old_caption1" value="$question_and_answers.answer_1"
        style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; 
               margin: 5px 0; background-color: #f9f9f9;"/>
  <Header value="✍️ New Caption:" size="4"/>
  <TextArea name="new_caption_1" toName="image" value="$question_and_answers.answer_1"
            placeholder="Type in new follow up caption 1 here"
            rows="5" maxSubmissions="1" required="true"
            style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; margin: 5px 0 15px 0;"/>
  <Header value="🪧 Reference if any:" size="6"/>
  <TextArea name="reference_1" toName="image"
            placeholder="Type in reference to your caption here if any"
            rows="2" maxSubmissions="1" style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; margin: 5px 0;"/>
  </View>
    
  <!-- Follow-Up Q2 -->
  <View className="section-box">
  <Header value="❓Follow-Up Question 2" size="3"/>
  <Text name="followup_q2" value="$question_and_answers.question_2"
        style="border: 2px solid #000; border-radius: 25px; padding: 10px 15px; 
               margin: 5px 0; background-color: #f9f9f9;"/>
